<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raffi | Embedded Cybersecurity Engineer</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at center, #0a0a0a, #000000);
  color: white;
  overflow-x: hidden;
  scroll-behavior: smooth;
  height: 100vh;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
}

section {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  scroll-snap-align: start;
}
h1 {
  font-size: 50px;
  margin: 0;
}

p {
  font-size: 18px;
  margin-top: 10px;
}

.highlight {
  color: #00ffcc;
}

.fade {
  opacity: 0;
  transform: translateY(40px);
  transition: all 1s ease;
}

.fade.show {
  opacity: 1;
  transform: translateY(0);
}

a {
  color: white;
  text-decoration: none;
  margin: 5px;
}
</style>
</head>

<body>

<!-- HERO SECTION -->
<section class="fade">
  <h1>Explore My World</h1>
  <p>Embedded Cybersecurity Engineer</p>
  <p class="highlight">Secure Boot • OTA • IoT Security</p>
</section>

<!-- ABOUT -->
<section class="fade">
  <h1>About Me</h1>
  <p>I design and secure embedded systems for real-world applications.</p>
</section>

<!-- PROJECTS -->
<section class="fade">
  <h1>My Work</h1>
  <p>Secure Boot • OTA Updates • IoT Security</p>
</section>

<!-- CONTACT -->
<section class="fade">
  <h1>Contact</h1>
  <p>Email: mohammadraffishaik40@gmail.com</p>
  <p>
    <a href="https://github.com/mohammadraffishaik" target="_blank">GitHub</a> |
    <a href="https://linkedin.com/in/mohammadraffishaik" target="_blank">LinkedIn</a>
  </p>
</section>

<script>
const sections = document.querySelectorAll('.fade');

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if(entry.isIntersecting){
      entry.target.classList.add('show');
    }
  });
}, { threshold: 0.3 });

sections.forEach(section => {
  observer.observe(section);
});
</script>

</body>
</html>
